<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">xConfig für Autodarts</title>
  <desc id="desc">xConfig companion-tool logo with a cyan X, segmented target ring and bullseye.</desc>
