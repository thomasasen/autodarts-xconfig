<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <title>Sanitized modern Autodarts X01 fixture</title>
</head>
<body>
  <main>
    <div class="flex flex-wrap items-center gap-2 absolute left-6 top-(--gameplay-bar-height) z-20 max-w-1/3">
      <div class="px-3 py-1 rounded-full bg-black-20/20 text-blue-05/85 text-sm font-heading font-semibold leading-[100%]">121</div>
      <div class="px-3 py-1 rounded-full bg-black-20/20 text-blue-05/85 text-sm font-heading font-semibold leading-[100%]">First to 1 Leg</div>
      <div class="px-3 py-1 rounded-full bg-black-20/20 text-blue-05/85 text-sm font-heading font-semibold leading-[100%]">SI-DO</div>
    </div>

    <div class="relative isolate flex-1 flex flex-col items-center overflow-clip @container min-h-36 text-black-05 bg-raspberry-slush-diagonal">
      <div class="absolute left-3 top-0 bottom-0 hidden flex-col justify-center gap-2 @[340px]:flex">
        <div class="bg-black-70 rounded-lg h-8 px-3 flex justify-center items-center font-number text-xl leading-none uppercase pt-1"><div class="text-checkout-suggestion">T20</div></div>
        <div class="bg-black-70 rounded-lg h-8 px-3 flex justify-center items-center font-number text-xl leading-none uppercase pt-1"><div class="text-checkout-suggestion">25</div></div>
        <div class="bg-black-70 rounded-lg h-8 px-3 flex justify-center items-center font-number text-xl leading-none uppercase pt-1"><div class="text-checkout-suggestion">D18</div></div>
      </div>
      <div class="relative flex items-center justify-center w-full flex-1 px-3 py-2 expanded:py-4 wide:py-6 wide:px-8 gap-5 wide:gap-6">
        <div class="flex min-w-0 flex-col gap-2 items-center justify-center flex-1">
          <div class="w-full flex justify-center items-center gap-1.5">
            <div class="size-2 rounded-full bg-mono-white shrink-0"></div>
            <div class="isolate flex flex-col min-w-0 cursor-pointer" role="button" tabindex="0">
              <div class="flex min-w-0 items-center">
                <div class="relative shrink-0 z-4 rounded-full border-2 border-black-05 dark:border-black-90"><span class="bg-black-90 rounded-full size-10.5"></span></div>
                <div class="bg-black-05 dark:bg-black-90 flex items-center gap-1.5 py-1 pr-px min-w-0 z-3 h-8 -ml-0.5 pl-4"><span class="font-display text-[18px] h-3.75 truncate block leading-none uppercase text-black-90 dark:text-black-05">PLAYER 1</span></div>
              </div>
            </div>
            <div class="size-2 shrink-0 invisible"></div>
          </div>
          <div class="flex justify-center items-center gap-1.5">
            <div class="font-number font-bold text-[4.5rem] leading-none h-14 flex items-start justify-center overflow-hidden @[260px]:text-[7.5rem] @[260px]:h-25 text-black-05">121</div>
            <div class="flex flex-col items-center justify-center gap-0.5"><div class="rounded-sm size-8 flex items-center justify-center bg-black-90 text-mono-grey-20"><span class="font-number text-2xl">0</span></div></div>
          </div>
        </div>
      </div>
    </div>

    <div class="flex-1 flex items-stretch rounded-2xl overflow-hidden shadow-[0_2px_0_rgba(13,13,13,0.5)] bg-surface-surface transition-colors duration-200 ease-in-out">
      <div class="flex-1 flex items-stretch justify-evenly overflow-hidden border-r border-black-70 pl-3 gap-3">
        <div class="@container relative flex justify-center items-center min-w-0 font-number font-bold leading-none text-shadow-2xs gap-1 w-full max-w-25 h-18 pt-1.5 text-checkout-suggestion"><span class="flex gap-1 whitespace-nowrap text-[min(2.5rem,40cqw)]"><span class="font-medium">T</span><span>20</span></span></div>
        <div class="@container relative flex justify-center items-center min-w-0 font-number font-bold leading-none text-shadow-2xs gap-1 w-full max-w-25 h-18 pt-1.5 text-checkout-suggestion"><span class="flex gap-1 whitespace-nowrap text-[min(2.5rem,40cqw)]"><span>25</span></span></div>
        <div class="@container relative flex justify-center items-center min-w-0 font-number font-bold leading-none text-shadow-2xs gap-1 w-full max-w-25 h-18 pt-1.5 text-checkout-suggestion"><span class="flex gap-1 whitespace-nowrap text-[min(2.5rem,40cqw)]"><span class="font-medium">D</span><span>18</span></span></div>
      </div>
      <div class="@container relative flex justify-center items-center min-w-0 font-number font-bold leading-none text-surface-surface-on text-shadow-2xs gap-1 w-full max-w-25 h-18 pt-1.5"><span class="text-[min(2.5rem,40cqw)]">0</span></div>
    </div>
  </main>
</body>
</html>
