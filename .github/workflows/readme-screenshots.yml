name: Refresh README screenshots
on:
  workflow_dispatch:
  push:
    branches:
      - docs/readme-modernization-20261106
    paths:
      - scripts/capture-xconfig-docs.mjs
      - .github/workflows/readme-screenshots.yml

permissions:
  contents: write

jobs:
  screenshots:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Install Chromium
        run: npx playwright install --with-deps chromium
      - name: Install ffmpeg for WebP compression
        run: sudo apt-get update -qq && sudo apt-get install -y ffmpeg
      - name: Capture actual xConfig shell using Playwright
        run: node scripts/capture-xconfig-docs.mjs
      - name: Check image output
        run: |
          find docs/screenshots -maxdepth 1 -name 'xconfig-*.webp' -printf '%f %k KB\n'
          test -f docs/screenshots/xconfig-overview-design.webp
          test -f docs/screenshots/xconfig-settings-wurfanzeige.webp
      - name: Commit optimized screenshots to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/xconfig-*.webp
          if ! git diff --cached --quiet; then
            git commit -m "docs: capture current xConfig UI screenshots"
            git fetch origin "$GITHUB_REF_NAME"
            git rebase "origin/$GITHUB_REF_NAME"
            git push origin "HEAD:$GITHUB_REF_NAME"
          fi
