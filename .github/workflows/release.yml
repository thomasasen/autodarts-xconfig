name: Userscript Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

concurrency:
  group: userscript-stable-release
  cancel-in-progress: false

jobs:
  validate:
    name: Validate release candidate
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out exact ref
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate tag and package parity
        if: github.ref_type == 'tag'
        run: npm run check:release -- --tag "${GITHUB_REF_NAME}"
      - name: Validate agent instructions
        run: npm run check:agents
      - name: Lint source
        run: npm run lint
      - name: Check JavaScript syntax
        run: npm run check:syntax
      - name: Run local runtime and unit tests
        run: npm run test:local
      - name: Rebuild release artifacts
        run: npm run build
      - name: Validate changelog
        run: npm run check:changelog
      - name: Validate release contracts
        run: npm run check:release ${{ github.ref_type == 'tag' && format('-- --tag "{0}"', github.ref_name) || '' }}
      - name: Verify committed dist is reproducible
        run: git diff --exit-code -- dist
      - name: Record release artifact hashes
        run: sha256sum dist/autodarts-xconfig.user.js dist/autodarts-xconfig.meta.js
      - name: Stage validated release artifacts
        uses: actions/upload-artifact@v4
        with:
          name: userscript-release-${{ github.sha }}
          path: |
            dist/autodarts-xconfig.user.js
            dist/autodarts-xconfig.meta.js
          if-no-files-found: error
          retention-days: 7

  draft-release:
    name: Stage GitHub draft release
    if: github.ref_type == 'tag'
    needs: validate
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: ${{ github.ref_name }}
    steps:
      - name: Download validated release artifacts
        uses: actions/download-artifact@v4
        with:
          name: userscript-release-${{ github.sha }}
          path: dist
      - name: Verify staged asset set
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t assets < <(find dist -maxdepth 1 -type f -printf '%f\n' | sort)
          expected=(autodarts-xconfig.meta.js autodarts-xconfig.user.js)
          diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${assets[@]}")
          sha256sum dist/autodarts-xconfig.user.js dist/autodarts-xconfig.meta.js
      - name: Create or safely reuse draft release
        shell: bash
        run: |
          set -euo pipefail
          error_file="$(mktemp)"
          if release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}" 2>"${error_file}")"; then
            :
          elif grep -q "HTTP 404" "${error_file}"; then
            release_json=""
          else
            cat "${error_file}" >&2
            exit 1
          fi
          if [[ -z "${release_json}" ]]; then
            gh release create "${TAG}" \
              dist/autodarts-xconfig.user.js \
              dist/autodarts-xconfig.meta.js \
              --repo "${GITHUB_REPOSITORY}" \
              --verify-tag \
              --draft \
              --title "${TAG}" \
              --generate-notes
            release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
          fi

          [[ "$(jq -r '.draft' <<<"${release_json}")" == "true" ]]
          [[ "$(jq -r '.prerelease' <<<"${release_json}")" == "false" ]]
          mapfile -t names < <(jq -r '.assets[].name' <<<"${release_json}" | sort)
          expected=(autodarts-xconfig.meta.js autodarts-xconfig.user.js)
          if [[ "${#names[@]}" -eq 0 ]]; then
            gh release upload "${TAG}" \
              dist/autodarts-xconfig.user.js \
              dist/autodarts-xconfig.meta.js \
              --repo "${GITHUB_REPOSITORY}"
            release_json="$(gh api "repos/${GITHUB_REPOSITORY}/releases/tags/${TAG}")"
            mapfile -t names < <(jq -r '.assets[].name' <<<"${release_json}" | sort)
          fi
          diff <(printf '%s\n' "${expected[@]}") <(printf '%s\n' "${names[@]}")
          for name in "${expected[@]}"; do
            local_hash="sha256:$(sha256sum "dist/${name}" | cut -d' ' -f1)"
            remote_hash="$(jq -r --arg name "${name}" '.assets[] | select(.name == $name) | .digest // empty' <<<"${release_json}")"
            [[ -n "${remote_hash}" && "${remote_hash}" == "${local_hash}" ]]
          done
